<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un profil enfant — Educalcul</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --blue: #3a6ea5; --gold: #c5a148; --cream: #fdf6e3; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); min-height: 100vh; }
    nav { background: var(--blue); height: 64px; display: flex; align-items: center; padding: 0 24px; gap: 12px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 8px; color: white; font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; }
    .nav-logo img { width: 32px; height: 32px; }
    .content { max-width: 560px; margin: 0 auto; padding: 100px 24px 60px; }
    .back { display: flex; align-items: center; gap: 8px; color: var(--blue); font-size: 13px; font-weight: 500; margin-bottom: 32px; cursor: pointer; }
    .back svg { width: 16px; height: 16px; }
    h1 { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 36px; }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); border: 1px solid rgba(197,161,72,0.2); padding: 36px; }
    .avatar-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid #e2e8f0; cursor: pointer; object-fit: cover; background: #f0f4ff; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: border 0.2s; }
    .avatar.selected { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(197,161,72,0.25); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--blue); margin-bottom: 8px; }
    input, select { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 15px; font-family: 'Inter', sans-serif; color: #222; outline: none; transition: border 0.2s; background: white; }
    input:focus, select:focus { border-color: var(--blue); }
    input.filled { border-color: var(--blue); background: #f8faff; }
    select.filled { border-color: var(--blue); background: #f8faff; }
    .input-hint { font-size: 11px; color: #aaa; margin-top: 5px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn { width: 100%; padding: 14px; background: var(--gold); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(197,161,72,0.3); }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #aaa; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="white" fill-opacity="0.15"/><text x="10" y="27" font-size="18" fill="white" font-family="Cinzel">E</text></svg>
      Educalcul
    </div>
  </nav>

  <div class="content">
    <div class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Retour à l'espace parent
    </div>

    <h1>Créer un profil enfant</h1>
    <div class="subtitle">Personnalisez l'espace d'apprentissage de votre enfant</div>

    <div class="card">
      <div class="section-title">Avatar</div>
      <div class="avatar-row">
        <div class="avatar">🦁</div>
        <div class="avatar selected">🐬</div>
        <div class="avatar">🦊</div>
        <div class="avatar">🐧</div>
        <div class="avatar">🦋</div>
        <div class="avatar">🐉</div>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" value="Lucas" class="filled" readonly />
      </div>

      <div class="row2">
        <div class="form-group">
          <label for="age">Âge</label>
          <input type="number" id="age" value="13" class="filled" readonly />
        </div>
        <div class="form-group">
          <label for="niveau">Niveau scolaire</label>
          <select id="niveau" class="filled">
            <option>CE1</option>
            <option>CE2</option>
            <option>CM1</option>
            <option>CM2</option>
            <option>6ème</option>
            <option>5ème</option>
            <option selected>4ème</option>
            <option>3ème</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="pseudo">Nom d'utilisateur</label>
        <input type="text" id="pseudo" value="lucas_maths" class="filled" readonly />
        <div class="input-hint">Utilisé pour se connecter (sans email)</div>
      </div>

      <div class="form-group">
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" value="••••••••" class="filled" readonly />
        <div class="input-hint">Minimum 6 caractères</div>
      </div>

      <button class="btn">Créer le profil de Lucas →</button>
    </div>
  </div>
</body>
</html>
